name: ScootPit BMS Android UI check
on:
  push:
    branches: [ main, "release/**" ]
  workflow_dispatch:
jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Free space for Android userdata image
        run: sudo rm -rf /usr/share/dotnet
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 240
          disable-animations: true
          script: bash .github/scripts/android-ui-check.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScootPit-BMS-UI-${{ matrix.api-level }}
          path: ui-screenshots/*.png
          if-no-files-found: ignore
